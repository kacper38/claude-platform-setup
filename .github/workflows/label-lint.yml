# Reports issues that break the label contract (exactly one status/*, at most one type/*,
# closed only via done/dropped). Comments once per finding set and keeps one tracking issue.
# Never edits labels. See tools/tracker/label_lint.py.
name: label-lint

on:
  issues:
    types: [opened, labeled, unlabeled, closed, reopened]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: label-lint
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: label-lint
        run: python3 tools/tracker/label_lint.py "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
