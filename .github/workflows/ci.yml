name: ci
on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: the guards read PR labels from the event payload, and a re-run keeps the
    # old payload, so applying test-removal-ok must start a fresh run
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet pytest ruff
      - run: ruff check tools
      - run: python -m pytest
      - name: installer is idempotent
        run: |
          bash -n install.sh
          mkdir -p /tmp/kit-target
          ./install.sh --into /tmp/kit-target
          ./install.sh --into /tmp/kit-target | tee /tmp/second.txt
          grep -q 'changes: 0 ' /tmp/second.txt
          test -f /tmp/kit-target/.claude/kit-version
      - name: installer sets core.hooksPath only when unset
        run: |
          git init -q /tmp/kit-git && ./install.sh --into /tmp/kit-git >/dev/null
          [ "$(git -C /tmp/kit-git config --get core.hooksPath)" = ".githooks" ]
          git init -q /tmp/kit-husky && git -C /tmp/kit-husky config core.hooksPath .husky
          ./install.sh --into /tmp/kit-husky > /tmp/husky.txt
          grep -q "left core.hooksPath=.husky" /tmp/husky.txt
          [ "$(git -C /tmp/kit-husky config --get core.hooksPath)" = ".husky" ]
          git init -q /tmp/kit-live && printf '#!/bin/sh\nexit 0\n' > /tmp/kit-live/.git/hooks/pre-commit
          ./install.sh --into /tmp/kit-live > /tmp/live.txt
          grep -q "live hooks in .git/hooks (pre-commit" /tmp/live.txt
          [ -z "$(git -C /tmp/kit-live config --get core.hooksPath)" ]
  commit-msg:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: commit messages in the PR range
        run: python3 tools/commit_msg.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  guards:
    name: guards (test tampering, image tags)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: test-tampering guard (diff vs the PR base; a push to main has nothing on top of it)
        env:
          BASE_REF: ${{ github.base_ref }}
          # the script reads labels from this list; an unlabeled PR must not fall back to gh (no token here)
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') || 'none' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash tools/testguard/check-test-tampering.sh
      - name: image tags never float (latest-tag scanner over the tracked tree)
        run: python3 tools/scan/latest_tag.py scan

  ci:
    name: ci
    if: always()
    needs: [test, commit-msg, guards]
    runs-on: ubuntu-latest
    steps:
      - name: every needed job succeeded (a skipped job is not green; GitHub would count it as passing)
        env:
          TEST: ${{ needs.test.result }}
          COMMIT_MSG: ${{ needs.commit-msg.result }}
          GUARDS: ${{ needs.guards.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "test=$TEST commit-msg=$COMMIT_MSG guards=$GUARDS event=$EVENT"
          [ "$TEST" = "success" ] || { echo "test did not succeed"; exit 1; }
          [ "$GUARDS" = "success" ] || { echo "guards did not succeed"; exit 1; }
          if [ "$EVENT" = "pull_request" ]; then
            [ "$COMMIT_MSG" = "success" ] || { echo "commit-msg did not succeed"; exit 1; }
          else
            [ "$COMMIT_MSG" = "skipped" ] || [ "$COMMIT_MSG" = "success" ] || { echo "commit-msg failed"; exit 1; }
          fi
